  #  ipc: "host"
  #  command: /bin/bash -c "
  #    sleep 3; 
  #    source /opt/ros/jazzy/setup.bash;
  #    ~/utils/CoppeliaSim_Edu_V4_7_0_rev4_Ubuntu24_04/coppeliaSim.sh -s 0 -f app/scenes/ros2_holonomic_b1z1_setup_static.ttt"  

  coppeliasim:
    image: murilomarinho/coppeliasim:noble_470rev4
    stop_signal: SIGINT
    platform: linux/amd64
    environment:
      DISPLAY: $DISPLAY # x server related
      ROS_DOMAIN_ID: 77
    privileged: true # Needed for some gpu configurations.
    volumes:
      - ../../scenes:/app/coppeliasim/scenes/
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ~/.Xauthority:/root/.Xauthority # x server related
    network_mode: "host" # x server related
    ipc: "host"
    command: /bin/bash -c "
      sleep 3;
      cd "$$COPPELIASIM_PATH"
      && ./coppeliaSim.sh -s0 /app/coppeliasim/scenes/ros2_holonomic_b1z1_setup_static.ttt"          

  micro_ros_agent:
    image: microros/micro-ros-agent:jazzy
    network_mode: "host"  # Share host network for ROS2 communication
    command: udp4 --port 8888 -v6
    restart: unless-stopped  # Optional: auto-restart if it crashes

  sas_unitree_b1z1_control_template:
    build:
      context: ../..  
      dockerfile: devel/sas_unitree_b1z1_control_template/Dockerfile
    environment:
      DISPLAY: $DISPLAY # x server related
      ROS_DOMAIN_ID: 77 # Set ROS domain ID for all ROS2 nodes
    privileged: true # Needed for some gpu configurations.
    volumes:
      #- repo-data:/root/git/rap2025_wholebodycontrol/software/ROS2/ros2_ws/src/sas_coppeliasim_unitree_b1z1/
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ~/.Xauthority:/root/.Xauthority # x server related
    network_mode: "host" # x server related
    ipc: "host"
    # One sas_legged_client_window (sas_tools) per robot, in monitor mode: status, emergency stop, and watchdog. The
    # clocks of this computer and of the robots are not synchronized, so the watchdog does not check the delay of its
    # triggers (as the former unitree_monitor).
    command: /bin/bash -c "
      source /opt/ros/jazzy/setup.bash;
      cd /app/software/ROS2/ros2_ws/ && source install/setup.bash && colcon build && source install/setup.bash;
      ros2 launch sas_legged_client_window sas_legged_client_window_launch.py node_name:=b1z1_white_monitor mode:=monitor
        legged_robot_prefix:=sas_b1/b1_1 own_driver_limb_prefixes:=\"['sas_z1/z1_1']\" watchdog_maximum_acceptable_delay_in_seconds:=1e30 &
      ros2 launch sas_legged_client_window sas_legged_client_window_launch.py node_name:=b1z1_black_monitor mode:=monitor
        legged_robot_prefix:=sas_b1/b1_2 own_driver_limb_prefixes:=\"['sas_z1/z1_2']\" watchdog_maximum_acceptable_delay_in_seconds:=1e30 &
      wait"