# Desktop side of the real experiment (Ubuntu Clerice PC). The drivers, the EKF, and the controller run on the
# B1 (see the README).
#   ros_jazzy_vicon:   motion_capture_tracking (the Vicon markers on tf) and RViz.
#   coppeliasim:       scenes/unitree_b1z1_ros2.ttt in mirror mode: it shows the real robot (EKF pose and joint
#                      states), and the frames x1 and xd1 of the controller.
#   micro_ros_agent:   the emergency stop of the lab (/sas/set/shutdown).
#   monitor_windows:   one sas_legged_client_window per B1Z1, in monitor mode (status, emergency stop, watchdog).
# ROS_DOMAIN_ID=77 for all.
#
# From this folder (xhost +local:root if the X server refuses the connection):
#   docker compose up --build
services:
  ros_jazzy_vicon:
    build: https://github.com/Adorno-Lab/docker_recipes.git#main:ubuntu_24/ros_jazzy_vicon
    environment:
      DISPLAY: $DISPLAY  # x server related
      ROS_DOMAIN_ID: 77 # Set ROS domain ID for all ROS2 nodes
    privileged: true # Needed for some gpu configurations.
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ~/.Xauthority:/root/.Xauthority # x server related
    network_mode: "host" # x server related and for ROS2 networking
    ipc: "host"
    command: /bin/bash -c "
      source /opt/ros/jazzy/setup.bash;
      cd ~/ros2_ws/ && colcon build;
      source ~/ros2_ws/install/setup.bash;
      ros2 launch motion_capture_tracking launch.py"

  coppeliasim:
    image: sas_unitree_b1z1_coppeliasim
    build:
      context: ../..
      dockerfile: devel/sas_unitree_b1z1_coppeliasim/Dockerfile
    environment:
      DISPLAY: $DISPLAY # x server related
      XAUTHORITY: /root/.Xauthority # x server related
      QT_X11_NO_MITSHM: 1 # x server related
      B1Z1_SCENE_MODE: mirror
      B1Z1_MIRROR_ROBOT_ID: 1 # 1: B1Z1-white (sas_b1/b1_1, sas_z1/z1_1), 2: B1Z1-black (sas_b1/b1_2, sas_z1/z1_2)
    privileged: true # Needed for some gpu configurations.
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro # x server related
      - ../../scenes:/app/scenes
    network_mode: "host"
    ipc: "host"
    stdin_open: true
    tty: true
    command: /bin/bash -c "
      $${COPPELIASIM_PATH}/coppeliaSim.sh -s0 /app/scenes/unitree_b1z1_ros2.ttt"

  micro_ros_agent:
    image: microros/micro-ros-agent:jazzy
    network_mode: "host"  # Share host network for ROS2 communication
    command: udp4 --port 8888 -v6
    restart: unless-stopped  # Optional: auto-restart if it crashes

  monitor_windows:
    image: sas_unitree_b1z1_control_template
    build:
      context: ../..
      dockerfile: devel/sas_unitree_b1z1_control_template/Dockerfile
    environment:
      DISPLAY: $DISPLAY # x server related
    privileged: true # Needed for some gpu configurations.
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ~/.Xauthority:/root/.Xauthority # x server related
    network_mode: "host" # x server related
    ipc: "host"
    # The clocks of this computer and of the robots are not synchronized, so the watchdog does not check the delay of
    # its triggers (the default of sas_legged_client_window).
    command: /bin/bash -c "
      ros2 launch sas_legged_client_window sas_legged_client_window_launch.py node_name:=b1z1_white_monitor mode:=monitor
        legged_robot_prefix:=sas_b1/b1_1 own_driver_limb_prefixes:=\"['sas_z1/z1_1']\" &
      ros2 launch sas_legged_client_window sas_legged_client_window_launch.py node_name:=b1z1_black_monitor mode:=monitor
        legged_robot_prefix:=sas_b1/b1_2 own_driver_limb_prefixes:=\"['sas_z1/z1_2']\" &
      wait"
