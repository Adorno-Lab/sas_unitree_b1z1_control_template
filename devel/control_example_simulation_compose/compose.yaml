# control_example in simulation.
#   coppeliasim: scenes/unitree_b1z1_ros2.ttt, which simulates the drivers of the B1 and the Z1, and the pose of
#                the robot (get/ekf/robot_pose).
#   controller:  control_example (control_example_b1z1_simulation_launch.py).
# Do not run the real drivers at the same time, on the same ROS_DOMAIN_ID (77, set in the images).
#
# CoppeliaSim starts the simulation (-s0), and the controller waits for the simulated drivers.
#
# From this folder (xhost +local:root if the X server refuses the connection):
#   docker compose up --build
services:
  coppeliasim:
    image: sas_unitree_b1z1_coppeliasim
    build:
      context: ../..
      dockerfile: devel/sas_unitree_b1z1_coppeliasim/Dockerfile
    environment:
      DISPLAY: $DISPLAY # x server related
      XAUTHORITY: /root/.Xauthority # x server related
      QT_X11_NO_MITSHM: 1 # x server related
      B1Z1_SCENE_MODE: simulation
    privileged: true # Needed for some gpu configurations.
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro # x server related
      # Mounted, not copied, so that the scenes saved from CoppeliaSim land in the repository.
      - ../../scenes:/app/scenes
    network_mode: "host"
    ipc: "host"
    stdin_open: true
    tty: true
    command: /bin/bash -c "
      $${COPPELIASIM_PATH}/coppeliaSim.sh -s0 /app/scenes/unitree_b1z1_ros2.ttt"

  controller:
    image: sas_unitree_b1z1_control_template
    depends_on:
      - coppeliasim
    build:
      context: ../..
      dockerfile: devel/sas_unitree_b1z1_control_template/Dockerfile
    environment:
      DISPLAY: $DISPLAY # x server related
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ~/.Xauthority:/root/.Xauthority # x server related
    network_mode: "host"
    ipc: "host"
    stdin_open: true
    tty: true
    stop_grace_period: 30s # sigterm_timeout of the launch file.
    command: /bin/bash -c "
      ros2 launch control_example control_example_b1z1_simulation_launch.py"
